<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Creator Archetype</title>
<style>
@font-face {
  font-family: 'EditorsNote';
  src: url('https://assets.cdn.filesafe.space/FpfeonohfE6TmE9W6y13/media/69c944b597dabd6644345ea7.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'TTChocolates';
  src: url('https://assets.cdn.filesafe.space/FpfeonohfE6TmE9W6y13/media/69c9454e97dabd4b88346c22.otf') format('opentype');
  font-weight: normal; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'UglyDave';
  src: url('https://assets.cdn.filesafe.space/FpfeonohfE6TmE9W6y13/media/69c944c797dabd35b234600c.otf') format('opentype');
  font-weight: normal; font-style: normal; font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'TTChocolates', 'Helvetica Neue', sans-serif;
  background: #fdf9f6;
  color: #5a4a3f;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  -webkit-font-smoothing: antialiased;
}

.quiz-wrap { width: 100%; max-width: 580px; }

.quiz-header {
  text-align: center;
  margin-bottom: 2.5rem;
  animation: fadeUp 0.7s ease both;
}

.eyebrow {
  font-family: 'UglyDave', sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #c4758a;
  margin-bottom: 14px;
  display: block;
}

.quiz-title {
  font-family: 'EditorsNote', serif;
  font-size: clamp(36px, 7vw, 52px);
  color: #B3688A;
  line-height: 1.05;
  margin-bottom: 10px;
}

.quiz-sub {
  font-size: 15px;
  color: #9a8880;
  line-height: 1.6;
  font-family: 'TTChocolates', sans-serif;
}

.progress-wrap {
  margin-bottom: 1.75rem;
  animation: fadeUp 0.7s ease 0.1s both;
}

.progress-track {
  height: 2px;
  background: rgba(179,104,138,0.15);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 6px;
}

.progress-fill {
  height: 100%;
  background: #B3688A;
  border-radius: 2px;
  transition: width 0.4s ease;
}

.progress-label {
  font-family: 'UglyDave', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #c4a8b0;
  text-align: right;
}

.card {
  background: #fff;
  border: 1px solid rgba(179,104,138,0.12);
  border-radius: 20px;
  padding: 2rem 1.75rem;
  animation: fadeUp 0.5s ease both;
}

.nurture-card {
  background: #f3ede5;
  border: 1px solid rgba(179,104,138,0.12);
  border-radius: 20px;
  padding: 2.25rem 2rem;
  text-align: center;
  animation: fadeUp 0.5s ease both;
}

.q-num {
  font-family: 'UglyDave', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #B3688A;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ab-badge {
  font-family: 'UglyDave', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: rgba(179,104,138,0.1);
  color: #B3688A;
  border-radius: 30px;
  padding: 3px 9px;
}

.q-text {
  font-family: 'EditorsNote', serif;
  font-size: clamp(20px, 3.5vw, 26px);
  color: #B3688A;
  line-height: 1.3;
  margin-bottom: 1.5rem;
}

.opts {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 15px;
  background: #fdf9f6;
  border: 1px solid rgba(179,104,138,0.15);
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  font-family: 'TTChocolates', sans-serif;
  transition: border-color 0.2s, background 0.2s;
}

.opt:hover { border-color: rgba(179,104,138,0.4); background: #fff; }
.opt.sel { border-color: #B3688A; background: #fff; }

.dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1.5px solid rgba(179,104,138,0.3);
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.opt.sel .dot { border-color: #B3688A; background: #B3688A; }

.dot-inner {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: white;
  opacity: 0;
  transition: opacity 0.2s;
}

.opt.sel .dot-inner { opacity: 1; }

.opt-label { font-size: 14.5px; color: #5a4a3f; line-height: 1.5; }
.opt-sub {
  font-size: 12px; color: #b8a8a0; margin-top: 2px;
  font-family: 'UglyDave', sans-serif; letter-spacing: 1px;
}

.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1.25rem;
}

.btn-back {
  font-family: 'UglyDave', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #c4a8b0;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 0;
}
.btn-back:hover { color: #9a8880; }

.btn-next {
  font-family: 'UglyDave', sans-serif;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #fff;
  background: #ad9565;
  border: none;
  border-radius: 50px;
  padding: 13px 32px;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}
.btn-next:not(:disabled):hover { background: #9a8457; transform: translateY(-1px); }
.btn-next:disabled { opacity: 0.35; cursor: default; }

.nurture-stat {
  font-family: 'EditorsNote', serif;
  font-size: 52px;
  color: #B3688A;
  line-height: 1;
  margin-bottom: 6px;
}
.nurture-stat-label {
  font-size: 14px; color: #9a8880; line-height: 1.6;
  max-width: 400px; margin: 0 auto 1.5rem;
}
.nurture-divider {
  width: 40px; height: 1px;
  background: rgba(179,104,138,0.3);
  margin: 1.5rem auto;
}
.nurture-heading { font-family: 'EditorsNote', serif; font-size: 22px; color: #B3688A; margin-bottom: 0.75rem; }
.nurture-body { font-size: 14px; color: #9a8880; line-height: 1.7; max-width: 420px; margin: 0 auto; }

.email-input {
  width: 100%; padding: 14px 16px; font-size: 15px;
  font-family: 'TTChocolates', sans-serif;
  border: 1px solid rgba(179,104,138,0.25); border-radius: 12px;
  background: #fdf9f6; color: #5a4a3f; margin-top: 1rem;
  outline: none; transition: border-color 0.2s;
}
.email-input:focus { border-color: #B3688A; }
.email-input::placeholder { color: #c4b8b0; }
.email-note {
  font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: #c4b8b0; margin-top: 8px; text-align: center;
}

/* ===== RESULT PAGE ===== */
.result-page {
  animation: fadeUp 0.7s ease both;
}

/* Hero */
.rp-hero {
  text-align: center;
  padding: 3rem 0 2rem;
}
.rp-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(179,104,138,0.08);
  border: 1px solid rgba(179,104,138,0.2);
  border-radius: 50px;
  padding: 7px 18px;
  font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: #B3688A;
  margin-bottom: 1.5rem; display: inline-flex;
}
.rp-badge span { width: 5px; height: 5px; border-radius: 50%; background: #B3688A; }
.rp-eyebrow {
  font-family: 'UglyDave', sans-serif; font-size: 11px; letter-spacing: 4px;
  text-transform: uppercase; color: #c4758a; margin-bottom: 0.75rem; display: block;
}
.rp-archetype-name {
  font-family: 'EditorsNote', serif;
  font-size: clamp(48px, 10vw, 80px);
  color: #B3688A; line-height: 0.95; margin-bottom: 1.25rem;
}
.rp-tagline {
  font-size: clamp(15px, 2vw, 17px); color: #9a8880; line-height: 1.7;
  max-width: 460px; margin: 0 auto 2rem;
}
.rp-quote {
  font-size: 16px; color: #5a4a3f; line-height: 1.75;
  max-width: 520px; margin: 0 auto 1.75rem;
  font-family: 'TTChocolates', sans-serif;
}

/* Score bar */
.rp-score {
  max-width: 380px; margin: 0 auto 2.5rem;
}
.rp-score-row {
  display: flex; justify-content: space-between;
  font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: #c4a8b0; margin-bottom: 8px;
}
.rp-score-track { height: 2px; background: rgba(179,104,138,0.12); border-radius: 2px; overflow: hidden; }
.rp-score-fill { height: 100%; background: #B3688A; border-radius: 2px; transition: width 1.2s ease; }

/* CTA */
.rp-cta { margin-bottom: 2.5rem; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.rp-btn {
  display: inline-block; font-family: 'TTChocolates', sans-serif; font-size: 14px;
  letter-spacing: 0.5px; text-transform: none; background: #ad9565; color: #fff;
  padding: 17px 48px; border-radius: 50px; text-decoration: none;
  transition: background 0.3s, transform 0.2s; border: none; cursor: pointer;
}
.rp-btn:hover { background: #9a8457; transform: translateY(-2px); }
.mockup-img {
  width: 100%; max-width: 560px;
  border-radius: 24px;
  margin: 1.75rem auto;
  display: block;
  border: 1px solid rgba(179,104,138,0.18);
}
.video-section {
  margin: 2rem 0 0;
}
.video-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 1rem;
}
.video-card { display: block; }
.iphone {
  background: #0b0b0b; padding: 14px; border-radius: 44px; display:block;
  box-shadow: 0 12px 24px rgba(0,0,0,0.2); border: 8px solid #0b0b0b; max-width:100%;
}
.iphone-screen { background: #000; border-radius: 28px; overflow: hidden; }
.iphone-screen video { display:block; width:100%; height:100%; }
@media (max-width: 830px) {
  .video-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 620px) {
  .video-grid { grid-template-columns: 1fr; }
}
.rp-sub-note {
  font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: #c4b8b0;
}

/* Divider */
.rp-divider { width: 40px; height: 1px; background: rgba(179,104,138,0.3); margin: 2.5rem auto; }

/* Breakdown card */
.breakdown-card {
  background: #fff; border: 1px solid rgba(179,104,138,0.12);
  border-radius: 20px; padding: 1.5rem 1.75rem; margin-bottom: 1.25rem;
}
.breakdown-label {
  font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: #c4a8b0; margin-bottom: 1rem;
}
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-name { font-size: 12px; color: #9a8880; min-width: 110px; font-family: 'TTChocolates', sans-serif; }
.bar-track { flex: 1; height: 3px; background: rgba(179,104,138,0.12); border-radius: 3px; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
.bar-pct { font-size: 11px; color: #c4b8b0; min-width: 28px; text-align: right; font-family: 'UglyDave', sans-serif; letter-spacing: 1px; }

/* Next card */
.next-card { background: #f3ede5; border-radius: 20px; padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; }
.next-eyebrow {
  font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: #B3688A; margin-bottom: 8px;
}
.next-text { font-family: 'EditorsNote', serif; font-size: 20px; color: #5a4a3f; line-height: 1.45; }

/* Mirror block */
.mirror-block {
  background: #f3ede5; border-left: 2px solid #B3688A;
  border-radius: 0 12px 12px 0; padding: 1.5rem 1.75rem; margin: 2rem 0;
}
.mirror-block p { font-family: 'EditorsNote', serif; font-size: 19px; color: #5a4a3f; line-height: 1.55; }

/* Traits grid */
.traits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 1.75rem 0; }
.trait-card { background: #fff; border: 1px solid rgba(179,104,138,0.12); border-radius: 16px; padding: 1.25rem; }
.trait-eyebrow {
  font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: #B3688A; margin-bottom: 8px;
}
.trait-text { font-size: 13.5px; color: #7a6a5f; line-height: 1.55; }

/* Section titles */
.rp-section-eyebrow {
  font-family: 'UglyDave', sans-serif; font-size: 11px; letter-spacing: 4px;
  text-transform: uppercase; color: #c4758a; margin-bottom: 10px; display: block;
}
.rp-section-title {
  font-family: 'EditorsNote', serif; font-size: clamp(28px, 4.5vw, 38px);
  color: #B3688A; line-height: 1.1; margin-bottom: 1.25rem;
}
.rp-body { font-size: 15px; color: #7a6a5f; line-height: 1.75; margin-bottom: 1.25rem; }
.rp-body strong { color: #5a4a3f; font-weight: 600; }

/* Truth list (dark card) */
.dark-card {
  background: #2e2420; border-radius: 20px; padding: 1.75rem; margin: 1.75rem 0;
}
.dark-card .rp-section-title { color: #f5ede6; font-size: clamp(22px, 3vw, 28px); }
.dark-card .rp-body { color: rgba(245,237,230,0.6); }
.dark-card .rp-body strong { color: #f5ede6; }
.truth-list { list-style: none; margin: 0.75rem 0 0; }
.truth-list li {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 14.5px; color: rgba(245,237,230,0.65); line-height: 1.6;
}
.truth-list li:last-child { border-bottom: none; }
.truth-dot { width: 5px; height: 5px; border-radius: 50%; background: #B3688A; flex-shrink: 0; margin-top: 9px; }

/* What you get */
.what-you-get {
  border: 1px solid rgba(179,104,138,0.15); border-radius: 20px;
  overflow: hidden; margin: 1.5rem 0; background: #fff;
}
.get-item {
  display: flex; align-items: flex-start; gap: 18px;
  padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(179,104,138,0.08);
}
.get-item:last-child { border-bottom: none; }
.get-num {
  font-family: 'EditorsNote', serif; font-size: 28px;
  color: rgba(179,104,138,0.25); line-height: 1; min-width: 26px; margin-top: -2px;
}
.get-content h4 { font-size: 15px; font-weight: 600; color: #5a4a3f; margin-bottom: 5px; font-family: 'TTChocolates', sans-serif; }
.get-content p { font-size: 13px; color: #9a8880; line-height: 1.6; }

/* Testimonials */
.testimonials { display: flex; flex-direction: column; gap: 14px; margin: 1.75rem 0; }
.testi {
  background: #fff; border: 1px solid rgba(179,104,138,0.12);
  border-radius: 16px; padding: 1.5rem;
}
.testi-text { font-family: 'EditorsNote', serif; font-size: 18px; color: #5a4a3f; line-height: 1.6; margin-bottom: 0.75rem; }
.testi-author { font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #c4a8b0; }
.testi-author span { color: #B3688A; }

/* Income block */
.income-block {
  background: #f3ede5; border: 1px solid rgba(173,149,101,0.2);
  border-radius: 20px; padding: 2rem; margin: 1.75rem 0; text-align: center;
}
.income-number { font-family: 'EditorsNote', serif; font-size: 60px; color: #ad9565; line-height: 1; margin-bottom: 6px; }
.income-label { font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #9a8880; }

/* Light gold section wrapper */
.pink-wrap {
  background: #f1ece7;
  border-radius: 20px; padding: 2rem; margin: 1.75rem 0;
}
.pink-wrap .rp-section-title { color: #9a7a4d; font-size: clamp(22px, 3vw, 30px); }
.pink-wrap .rp-body { color: #6a5a43; }

/* Pricing card */
.pricing-card {
  background: #fff; border: 1px solid rgba(179,104,138,0.18);
  border-radius: 24px; padding: 2rem 1.75rem; margin: 1.75rem 0; text-align: center;
}
.pricing-card h3 { font-family: 'EditorsNote', serif; font-size: clamp(28px, 5vw, 40px); color: #B3688A; margin-bottom: 6px; }
.pricing-price { font-family: 'EditorsNote', serif; font-size: 72px; color: #ad9565; line-height: 1; margin: 1rem 0 4px; }
.pricing-note { font-family: 'UglyDave', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #c4a8b0; margin-bottom: 1.5rem; }
.check-list { display: flex; flex-direction: column; gap: 8px; margin: 1.5rem 0; text-align: left; }
.check-item {
  background: #fdf9f6; border: 1px solid rgba(179,104,138,0.1);
  border-radius: 50px; padding: 11px 18px;
  font-size: 14px; color: #5a4a3f; display: flex; gap: 10px; align-items: center;
}
.check-icon { color: #B3688A; font-size: 13px; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  body { padding: 28px 16px; }
  .card, .nurture-card { padding: 1.5rem 1.25rem; }
  .quiz-title { font-size: 34px; }
  .traits-grid { grid-template-columns: 1fr; }
  .rp-archetype-name { font-size: 52px; }
  .pricing-price { font-size: 56px; }
}
</style>
</head>
<body>

<div class="quiz-wrap" id="quiz-wrap">

  <div class="quiz-header">
    <h1 class="quiz-title">What's Your Creator Archetype?</h1>
    <p class="quiz-sub">Find out exactly how you're wired to build a personal brand and what to do first</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="pf" style="width:0%"></div></div>
    <div class="progress-label" id="pl">Question 1 of 10</div>
  </div>

  <div id="qcard"></div>

  <div class="nav-row">
    <button class="btn-back" id="bbk" onclick="prevQ()">back</button>
    <button class="btn-next" id="bnx" onclick="nextQ()" style="display:none">Keep going</button>
  </div>

</div>

<script>
/* ─────────────────────────────────────────────
   QUIZ DATA   12 steps total
   Q1-3  Hook / identity + desire          (A/B zone)
   Q4-5  Pain + past failures
   Q6-7  Nurture slide
   Q8-10 Awareness + resistance
   Q11   Email capture
   Q12   Final desire
───────────────────────────────────────────── */
const steps = [

  /* Q1 Hook, A/B */
  {
    type:'q', ab:true,
    text:'Be honest. When you think about building a personal brand and actually getting paid for it where are you right now?',
    opts:[
      {l:'I post but no one\'s buying anything. I have no idea how to make the content actually convert',s:'posting but not earning',a:'V'},
      {l:'I keep watching other girls live this life and wondering why it isn\'t me yet',s:'watching from the sidelines',a:'C'},
      {l:'I\'ve tried things before network marketing, digital products and nothing really worked',s:'been burned before',a:'B'},
      {l:'I know I want this but I\'m honestly a little scared to actually start',s:'ready but hesitant',a:'A'}
    ]
  },

  /* Q2 Desire, A/B */
  {
    type:'q', ab:true,
    text:'When you imagine a life where your phone is actually paying you what does that feel like?',
    opts:[
      {l:'Traveling whenever I want, staying somewhere beautiful, never having to check my bank account',s:'total freedom and travel',a:'V'},
      {l:'Quitting my job and owning my time completely',s:'job freedom',a:'A'},
      {l:'Building something I\'m genuinely proud of. A brand, an income, a legacy',s:'purpose and impact',a:'B'},
      {l:'Being surrounded by women who get it, who push me, who celebrate with me',s:'community and belonging',a:'C'}
    ]
  },

  /* Q3 Hook, A/B */
  {
    type:'q', ab:true,
    text:'If you\'re being really honest what\'s the main thing standing between you and making money from your content right now?',
    opts:[
      {l:'I post but I have no real system. I just throw things up and hope something sticks',s:'no system',a:'B'},
      {l:'I\'m scared of being judged or coming across as salesy or "one of those people"',s:'reputation fear',a:'C'},
      {l:'I\'ve tried things before and they didn\'t work. Now I\'m not sure what to believe',s:'past attempts blocked me',a:'V'},
      {l:'Honestly, I don\'t even know where to start',s:'total beginner',a:'A'}
    ]
  },

  /* Q4 Pain */
  {
    type:'q',
    text:'What does your content actually look like right now?',
    opts:[
      {l:'I post here and there lifestyle stuff, things I love. Nothing strategic',s:'casual poster',a:'V'},
      {l:'I barely post. I scroll way more than I create',s:'mostly scrolling',a:'B'},
      {l:'I post pretty consistently and get engagement but nobody\'s buying anything',s:'active but not earning',a:'C'},
      {l:'I\'ve started accounts, deleted them, restarted. I can\'t seem to find my thing',s:'restart loop',a:'A'}
    ]

let cur = 0;
let answers = new Array(steps.length).fill(null);

function qCount() { return steps.filter(s => s.type === 'q').length; }
function qIndex(i) {
  let c = 0;
  for (let j = 0; j <= i; j++) { if (steps[j].type === 'q') c++; }
  return c;
}

function render() {
  const s = steps[cur];
  const card = document.getElementById('qcard');
  const pct = Math.round((cur / steps.length) * 100);
  document.getElementById('pf').style.width = pct + '%';

  if (s.type === 'q') {
    const qi = qIndex(cur);
    document.getElementById('pl').textContent = 'Question ' + qi + ' of ' + qCount();
    card.innerHTML = `
      <div class="card">
        <p class="q-num">Question ${qi}</p>
        <p class="q-text">${s.text}</p>
        <div class="opts">
          ${s.opts.map((o, i) => `
            <button class="opt${answers[cur] === i ? ' sel' : ''}" onclick="sel(${i})">
              <div class="dot"><div class="dot-inner"></div></div>
              <div>
                <div class="opt-label">${o.l}</div>
                <div class="opt-sub">${o.s}</div>
              </div>
            </button>
          `).join('')}
        </div>
      </div>`;
    // auto-advance on answer click; no global Continue button
    document.getElementById('bnx').style.display = 'none';

  } else if (s.type === 'nurture') {
    document.getElementById('pl').textContent = 'Almost there';
    card.innerHTML = `
      <div class="nurture-card">
        ${s.stat ? `<div class="nurture-stat">${s.stat}</div>` : ''}
        ${s.statLabel ? `<p class="nurture-stat-label">${s.statLabel}</p>` : ''}
        <div class="nurture-divider"></div>
        <p class="nurture-heading">${s.heading}</p>
        <p class="nurture-body">${s.body}</p>
      </div>`;
    document.getElementById('bnx').style.display = 'inline-block';
    document.getElementById('bnx').disabled = false;
    document.getElementById('bnx').textContent = 'Keep going';

  } else if (s.type === 'email') {
    document.getElementById('pl').textContent = 'One more step';
    card.innerHTML = `
      <div class="card">
        <p class="q-num">Almost done</p>
        <p class="q-text">${s.text}</p>
        <p style="font-size:13px;color:#c4b8b0;font-family:'TTChocolates',sans-serif;">${s.subtext}</p>
        <input class="email-input" type="text" placeholder="your first name" id="nameinput" value="${nameVal}" oninput="onName(this.value)" />
        <input class="email-input" type="email" placeholder="your@email.com" id="emailinput" value="${emailVal}" oninput="onEmail(this.value)" />
        <p class="email-note">no spam. just your result + first steps.</p>
        <div style="text-align:center;margin-top:14px;"><button class="rp-btn" id="emailSubmit" disabled onclick="submitEmail()">Get My Result →</button></div>
      </div>`;
    document.getElementById('bnx').style.display = 'none';
  }

  document.getElementById('bbk').style.visibility = cur === 0 ? 'hidden' : 'visible';
}

function sel(i) {
  if (steps[cur].type !== 'q') return;
  answers[cur] = i;
  if (cur === steps.length - 1) {
    showResult();
    return;
  }
  cur++;
  render();
}

function onEmail(v) {
  emailVal = v;
  const btn = document.getElementById('emailSubmit');
  if (btn) btn.disabled = !isEmailValid() || nameVal.trim().length < 2;
}

function onName(v) {
  nameVal = v;
  const btn = document.getElementById('emailSubmit');
  if (btn) btn.disabled = !isEmailValid() || nameVal.trim().length < 2;
}

function isEmailValid() {
  return emailVal.includes('@') && emailVal.length >= 5;
}

function nextQ() {
  if (steps[cur].type === 'q' && answers[cur] === null) return;
  if (cur === steps.length - 1) { showResult(); return; }
  cur++;
  render();
}

function prevQ() { if (cur === 0) return; cur--; render(); }

/* ── TRACKING ── */
function track(event, data) {
  fetch('/api/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ event, ...data, ts: Date.now() })
  }).catch(() => {});
}

function getAnswerRecords() {
  return steps.map((s, i) => {
    if (s.type !== 'q' || answers[i] === null) return null;
    const selected = s.opts[answers[i]] || {};
    return {
      step: i,
      question: s.text,
      answer: selected.l || selected.s || String(answers[i]),
      archetype: selected.a || null
    };
  }).filter(Boolean);
}

/* patch sel() to track question answers + quiz start */
let quizStarted = false;
const _sel = sel;
sel = function(i) {
  if (!quizStarted) { quizStarted = true; track('quiz_start', {}); }
  track('question_answer', {
    step: cur,
    answer: i,
    archetype_vote: steps[cur]?.opts?.[i]?.a,
    answer_label: steps[cur]?.opts?.[i]?.l || steps[cur]?.opts?.[i]?.s || String(i)
  });
  _sel(i);
};

/* submit email and move to results */
function submitEmail() {
  if (!isEmailValid() || nameVal.trim().length < 2) return;
  const answerRecords = getAnswerRecords();
  track('email_submit', {
    email: emailVal,
    name: nameVal,
    answer: JSON.stringify({ name: nameVal, answers: answerRecords }),
    answers_payload: JSON.stringify(answerRecords)
  });
  fetch('/api/ghl', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: emailVal, name: nameVal, answers: answerRecords })
  }).catch(() => {});
  showResult();
}

/* patch showResult() to fire result_view with archetype */
let currentArchetype = null;
const _showResult = showResult;
showResult = function() {
  _showResult();
  const c = { V:0, B:0, C:0, A:0 };
  steps.forEach((s,i) => { if (s.type === 'q' && answers[i] !== null) c[s.opts[answers[i]].a]++; });
  currentArchetype = Object.entries(c).sort((a,b) => b[1]-a[1])[0][0];
  track('result_view', { archetype: currentArchetype });
};

/* CTA click tracking */
document.addEventListener('click', function(e) {
  if (e.target.closest('a.rp-btn')) {
    track('cta_click', { archetype: currentArchetype });
  }
});
